<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AURA Dashboard - Phase 2</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
        <h1>AURA — AI-Assisted Urban Routing & Adaptive Traffic Control</h1>
        <div id="status">Connecting...</div>
    </div>
    
    <div id="container">
        <div id="map"></div>
        <div id="sidebar">
            <h2>Routing Engine</h2>
            <div id="routing-panel" style="background:#222; padding:10px; margin-bottom:15px; border-radius:5px;">
                <label>Origin: 
                    <select id="route-origin">
                        <option value="J1">J1 Edappally</option>
                        <option value="J2">J2 Palarivattom</option>
                        <option value="J3">J3 Vyttila</option>
                        <option value="J4">J4 Kundanoor</option>
                        <option value="J5">J5 Kakkanad</option>
                        <option value="J6">J6 Tripunithura</option>
                    </select>
                </label><br>
                <label>Dest: 
                    <select id="route-dest">
                        <option value="J3" selected>J3 Vyttila</option>
                        <option value="J4">J4 Kundanoor</option>
                        <option value="J1">J1 Edappally</option>
                    </select>
                </label><br>
                <button onclick="requestRoute()" style="margin-top:10px; padding:5px; cursor:pointer;">Find Route</button>
            </div>
            <div id="route-results"></div>

            <h2>Junction State (Phase 4A)</h2>
            <div id="junctions-list">Waiting for data...</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
